<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#bde7d0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Math Suika" />
    <meta name="description" content="같은 값의 과일을 합치며 초등 2~4학년 창의 수학을 익히는 수박 게임" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Math Suika Game</title>
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="stat"><small>점수</small><b id="score">0</b></div>
        <div class="stat"><small>최고</small><b id="best">0</b></div>
        <div class="next"><small>다음</small><canvas id="next" width="120" height="120"></canvas></div>
        <button id="btn-settings" class="icon-btn" aria-label="설정">⚙️</button>
      </header>

      <div id="goals" class="goals hidden" aria-live="polite"></div>

      <main class="stage">
        <canvas id="board"></canvas>
        <div id="toast" class="toast" role="status"></div>
      </main>

      <section class="ladder" id="ladder" aria-label="과일 성장 사다리"></section>

      <nav class="powerups" aria-label="아이템">
        <button data-pu="hint"><img class="ico" src="/assets/ui/pu-hint.png" alt="" /><span class="nm">힌트</span><i id="pu-hint">0</i></button>
        <button id="btn-bomb" data-pu="bomb"><img class="ico" src="/assets/ui/pu-bomb.png" alt="" /><span class="nm">폭탄</span><i id="pu-bomb">0</i></button>
        <button data-pu="shake"><img class="ico" src="/assets/ui/pu-shake.png" alt="" /><span class="nm">흔들기</span><i id="pu-shake">0</i></button>
        <button data-pu="undo"><img class="ico" src="/assets/ui/pu-undo.png" alt="" /><span class="nm">되돌리기</span><i id="pu-undo">0</i></button>
      </nav>

      <div id="overlay" class="overlay hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
